services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classmate
      POSTGRES_USER: classmate
      POSTGRES_PASSWORD: classmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classmate -d classmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    env_file: .env
    command: ["python", "-m", "classmate.bot.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "classmate.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
